[package]
name = "srt2txt"
version = "0.1.0"
edition = "2021"
authors = ["Christoph Kieslich c.kieslich@gmail.com"]
description = "Convert SRT subtitle files into clean plain text (strip timestamps, tags, merge lines)"
repository = "https://github.com/chrisdoc/srt2txt"
homepage = "https://github.com/chrisdoc/srt2txt"
keywords = ["subtitle", "srt", "transcript", "cli", "text"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.89.0"
license-file = "LICENSE"
exclude = ["srt/*", "target/*", ".github/*"]

[badges]
github-actions = { repository = "chrisdoc/srt2txt", workflow = "CI" }

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
walkdir = "2.5"
regex = "1"
anyhow = "1"
thiserror = "1"
rayon = "1.10"
lazy_static = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "prepush-hook", "run-cargo-fmt", "run-cargo-clippy"] }

[package.metadata.husky]
pre-commit = "cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings"
pre-push = "cargo test --all --quiet"
# You could add: pre-push = "cargo test --all --quiet"

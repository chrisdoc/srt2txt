name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Ensure only one release pipeline runs per tag/branch
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: only write contents when creating release, packages write for publish
permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify crate before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from Cargo.toml
        id: cargo
        run: |
          version=$(grep '^version =' Cargo.toml | head -n1 | sed -E "s/version = \"(.*)\"/\1/")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Ensure tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION='${{ steps.cargo.outputs.version }}'
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Lint & Test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features --no-fail-fast
      - name: Package (dry run)
        run: cargo publish --locked --dry-run
      - name: Upload crate package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: crate-package-metadata
          path: target/package

  publish:
    name: Publish & Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
